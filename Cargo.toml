[package]
name = "recursive-imt-poc"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["minimal-recursion"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
rayon = "=1.12.0"
bincode = "1.3.3"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = { version = "0.10", features = ["std_rng", "sys_rng"] }
spartan-whir = { git = "https://github.com/ethereum/spartan-whir", rev = "14d6da4211eda59e65cfd0af5e2dcd89d523edc3", features = ["parallel"] }
p3-field = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-koala-bear = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-symmetric = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-challenger = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-field-outer = { package = "p3-field", version = "=0.9.0-rc.2" }
p3-koala-bear-outer = { package = "p3-koala-bear", version = "=0.9.0-rc.2" }
# Keep the selected transitive FRI backend on exactly the same release.
p3-challenger-outer = { package = "p3-challenger", version = "=0.9.0-rc.2" }
p3-commit-outer = { package = "p3-commit", version = "=0.9.0-rc.2" }
p3-dft-outer = { package = "p3-dft", version = "=0.9.0-rc.2" }
p3-fri-outer = { package = "p3-fri", version = "=0.9.0-rc.2" }
p3-merkle-tree-outer = { package = "p3-merkle-tree", version = "=0.9.0-rc.2" }
p3-symmetric-outer = { package = "p3-symmetric", version = "=0.9.0-rc.2" }
p3-uni-stark-outer = { package = "p3-uni-stark", version = "=0.9.0-rc.2" }

[profile.release]
codegen-units = 16
lto = "thin"
