[workspace]
members = ["crates/flock-backend"]
exclude = ["vendor/p3-recursion", "vendor/p3-sumcheck", "vendor/p3-multi-stark", "vendor/p3-gkr", "vendor/p3-bus"]
resolver = "2"

[package]
name = "recursive-imt-prover"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "tree-demo"

[dependencies]
imt-flock-backend = { path = "crates/flock-backend" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "=1.12.0"
sha3 = "0.10.8"
hex = "0.4.3"
rand = { version = "0.10", features = ["std_rng", "sys_rng"] }
postcard = { version = "1", features = ["alloc"] }
p3-air = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-keccak-air = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-security = "=0.9.0-rc.2"
p3-binary-field = "=0.9.0-rc.2"
p3-binary-dft = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-keccak = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-binary-pcs = "=0.9.0-rc.2"
p3-bus = "=0.9.0-rc.2"
p3-multi-stark = "=0.9.0-rc.2"
p3-multilinear-util = "=0.9.0-rc.2"
p3-sumcheck = "=0.9.0-rc.2"
p3-whir = "=0.9.0-rc.2"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-recursion = { path = "vendor/p3-recursion", features = ["parallel"] }

[build-dependencies]
sha3 = "0.10.8"

[profile.release]
codegen-units = 16
lto = "thin"

[lints.clippy]
items_after_statements = "warn"
wildcard_imports = "warn"

[[example]]
name = "binary-upstream"
path = "vendor/p3-recursion/examples/native_binary_recursion.rs"

[patch."https://github.com/Plonky3/Plonky3"]
p3-sumcheck = { path = "vendor/p3-sumcheck" }
p3-multi-stark = { path = "vendor/p3-multi-stark" }
p3-gkr = { path = "vendor/p3-gkr" }
p3-bus = { path = "vendor/p3-bus" }
