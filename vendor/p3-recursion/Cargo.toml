[package]
name = "p3-recursion"
description = "Plonky3 native support for recursive proof composition"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3-recursion"
homepage = "https://github.com/Plonky3/Plonky3-recursion"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

# Share integration fixture types across a small number of test crates.
autotests = false

[dependencies]
p3-maybe-rayon = "0.9.0-rc.2"

# Other dependencies
blake3 = { version = "1.8.4", default-features = false }
hashbrown = "0.17.1"
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
# Plonky3 dependencies
p3-air = "0.9.0-rc.2"
p3-baby-bear = "0.9.0-rc.2"
p3-batch-stark = "0.9.0-rc.2"
p3-binary-dft = "0.9.0-rc.2"
p3-binary-field = "0.9.0-rc.2"
p3-binary-pcs = "0.9.0-rc.2"
p3-blake3 = "0.9.0-rc.2"
p3-bus = "0.9.0-rc.2"
p3-challenger = "0.9.0-rc.2"

# Local dependencies
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-commit = "0.9.0-rc.2"
p3-dft = "0.9.0-rc.2"
p3-field = "0.9.0-rc.2"
p3-fri = "0.9.0-rc.2"
p3-goldilocks = "0.9.0-rc.2"
p3-keccak = "0.9.0-rc.2"
p3-koala-bear = "0.9.0-rc.2"
p3-lookup = "0.9.0-rc.2"
p3-matrix = "0.9.0-rc.2"
p3-merkle-tree = "0.9.0-rc.2"
p3-multi-stark = "0.9.0-rc.2"
p3-multilinear-util = "0.9.0-rc.2"
p3-poseidon2-air = "0.9.0-rc.2"
p3-poseidon2-circuit-air = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-sumcheck = "0.9.0-rc.2"
p3-symmetric = "0.9.0-rc.2"
p3-uni-stark = "0.9.0-rc.2"
p3-util = "0.9.0-rc.2"
p3-whir = "0.9.0-rc.2"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
unroll = { version = "0.1.5", default-features = false }

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
mimalloc = { version = "0.1", default-features = false }
p3-air = "0.9.0-rc.2"
p3-blake3-air = "0.9.0-rc.2"
p3-challenger = "0.9.0-rc.2"
p3-dft = "0.9.0-rc.2"
p3-goldilocks = "0.9.0-rc.2"
p3-keccak-air = "0.9.0-rc.2"
p3-matrix = "0.9.0-rc.2"
p3-poseidon2 = "0.9.0-rc.2"
p3-test-utils = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-util = "0.9.0-rc.2"
proptest = { version = "1.11", default-features = true }
rand = { version = "0.10.3", default-features = false }
rayon = "1.12"
tracing-forest = { version = "0.3.1", features = ["smallvec"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "env-filter"] }

[features]
parallel = [
    "p3-maybe-rayon/parallel",
    "p3-circuit/parallel",
    "p3-circuit-prover/parallel",
    "p3-poseidon2-circuit-air/parallel",
]

[[test]]
name = "binary_boolean"
path = "tests/suites/binary_boolean.rs"

[[test]]
name = "binary_components"
path = "tests/suites/binary_components.rs"

[[test]]
name = "binary_poly"
path = "tests/suites/binary_poly.rs"

[[test]]
name = "binary_stark"
path = "tests/suites/binary_stark.rs"

[[test]]
name = "fri_recursion"
path = "tests/suites/fri_recursion.rs"

[[test]]
name = "native_recursion"
path = "tests/suites/native_recursion.rs"

[[test]]
name = "prepared_recursion"
path = "tests/suites/prepared_recursion.rs"

[[test]]
name = "protocol_contracts"
path = "tests/suites/protocol_contracts.rs"

[[test]]
name = "whir_recursion"
path = "tests/suites/whir_recursion.rs"

[[test]]
name = "whir_quintic"
path = "tests/whir_quintic.rs"
